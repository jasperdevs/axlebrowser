<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab - Axle</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #0a0a0a;
        color: #e4e4e4;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }

      .logo {
        width: 64px;
        height: 64px;
        margin-bottom: 32px;
        opacity: 0.15;
      }

      .search-container {
        width: 100%;
        max-width: 480px;
        padding: 0 16px;
      }

      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 16px;
        border: 1px solid #1e1e1e;
        background: #1a1a1a;
        transition: border-color 0.2s;
      }

      .search-box:focus-within {
        border-color: rgba(255, 255, 255, 0.15);
      }

      .search-icon {
        flex-shrink: 0;
        color: #555;
      }

      input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #e4e4e4;
        font-size: 14px;
        font-family: inherit;
      }

      input::placeholder {
        color: #555;
      }

      .hint {
        margin-top: 16px;
        font-size: 11px;
        color: rgba(85, 85, 85, 0.5);
        text-align: center;
      }

      .brand {
        position: absolute;
        bottom: 24px;
        font-size: 11px;
        color: rgba(85, 85, 85, 0.3);
        letter-spacing: 2px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <!-- Simple X logo as SVG inline -->
    <svg class="logo" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 16L48 48M48 16L16 48" stroke="white" stroke-width="4" stroke-linecap="round" />
    </svg>

    <div class="search-container">
      <form id="search-form" class="search-box">
        <svg
          class="search-icon"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <circle cx="6.5" cy="6.5" r="4.5" />
          <line x1="10" y1="10" x2="14" y2="14" />
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Search or enter URL..."
          autofocus
          spellcheck="false"
          autocomplete="off"
        />
      </form>
    </div>

    <p class="hint">Ctrl+L to open the omnibox</p>
    <span class="brand">Axle</span>

    <script>
      const form = document.getElementById('search-form')
      const input = document.getElementById('search-input')

      form.addEventListener('submit', (e) => {
        e.preventDefault()
        const query = input.value.trim()
        if (!query) return

        if (query.includes('.') && !query.includes(' ')) {
          window.location.href = query.startsWith('http') ? query : 'https://' + query
        } else {
          window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(query)
        }
      })
    </script>
  </body>
</html>
